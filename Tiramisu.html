<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聊天阅读器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  /* 让 hidden 属性强制生效（防止 display:flex 把它覆盖掉） */
  [hidden] { display: none !important; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f2f3f5;
    color: #1a1a1a;
  }

  /* ===== 第一屏：选择文件 ===== */
  #drop {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 40px 24px; text-align: center;
    background: linear-gradient(160deg, #f6f8fb 0%, #e6ecf4 100%);
    border: 3px dashed #b9c4d2; margin: 16px; border-radius: 20px;
  }
  #drop.drag { background: #dce9ff; border-color: #4a6cf7; }
  #drop .icon { font-size: 64px; line-height: 1; }
  #drop h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  #drop p { color: #6b7686; font-size: 15px; line-height: 1.7; }
  #drop .btn {
    margin-top: 6px; padding: 13px 34px; font-size: 16px; font-weight: 600; color: #fff;
    background: #4a6cf7; border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(74,108,247,.35);
  }
  #drop .btn:active { transform: scale(.97); }
  #drop .hint { font-size: 12px; color: #9aa5b4; }

  /* ===== 第二屏：预览 ===== */
  #viewer { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; max-width: 780px; margin: 0 auto; }

  header {
    background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid #e6e9ee; padding: 8px 12px 8px;
  }
  header .bar { display: flex; align-items: center; gap: 6px; }
  #back {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 2px;
    padding: 8px 10px; margin-right: 2px;
    font-size: 16px; font-weight: 600; color: #4a5568;
    background: transparent; border: none; border-radius: 10px; cursor: pointer;
  }
  #back:hover { background: #f1f3f6; }
  .title-wrap { flex: 1; min-width: 0; }
  .title-wrap h2 { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title-wrap .meta { font-size: 12px; color: #9aa5b4; margin-top: 1px; }

  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    padding: 4px 12px; font-size: 12px; border-radius: 999px; cursor: pointer;
    background: #f1f3f6; color: #4a5568; border: 1px solid #e2e6ec;
  }
  .chip.on { background: #4a6cf7; color: #fff; border-color: #4a6cf7; }

  /* ===== 聊天区 ===== */
  #chat { flex: 1; overflow-y: auto; padding: 14px 14px 50px; }

  .divider { text-align: center; margin: 16px 0 14px; }
  .divider span {
    font-size: 12px; color: #9aa5b4; background: rgba(0,0,0,.05);
    padding: 4px 12px; border-radius: 999px; display: inline-block;
  }

  .msg { display: flex; align-items: flex-start; }
  .msg + .msg { margin-top: 12px; }
  .msg.grouped { margin-top: 2px; }
  .msg.right { justify-content: flex-end; }   /* 右对齐消息贴右边缘 */

  .bubble-wrap { display: flex; flex-direction: column; max-width: 76%; min-width: 0; }
  .msg.right .bubble-wrap { align-items: flex-end; }

  .name { font-size: 12px; color: #8a95a5; margin: 0 4px 4px; }
  .msg.left .name { text-align: left; }
  .msg.right .name { text-align: right; }
  .msg.grouped .name { display: none; }

  .bubble {
    padding: 10px 14px; border-radius: 16px;
    font-size: 15px; line-height: 1.7;
    background: #ffffff;
    border: 1px solid #d9dde3;               /* 浅灰色系边框 */
    color: #4b5563;                            /* 深灰色字体 */
    word-break: break-word; overflow-wrap: anywhere;
    white-space: normal;
  }
  .msg.left .bubble  { border-top-left-radius: 4px; }
  .msg.right .bubble { border-top-right-radius: 4px; }
  .bubble strong { font-weight: 700; color: #1f2937; }
  .bubble code {
    background: #f1f3f6; padding: 1px 6px; border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
    color: #c0392b;
  }
  .bubble a { color: #4a6cf7; text-decoration: underline; word-break: break-all; }
  .bubble br { display: block; margin: 4px 0; content: ""; }

  .time { font-size: 11px; color: #a6b0bf; margin: 4px 6px 0; }
  .msg.right .time { text-align: right; }

  #error { text-align: center; color: #d64545; padding: 60px 20px; font-size: 14px; line-height: 1.8; }
  #error pre { background: #fff; border-radius: 10px; padding: 12px; margin: 12px auto; max-width: 90%;
    font-size: 12px; text-align: left; overflow: auto; color: #555; }
</style>
</head>
<body>

  <!-- 第一屏：选择文件 -->
  <div id="drop">
    <div class="icon">💬</div>
    <h1>聊天阅读器</h1>
    <p>把聊天文件拖到这块区域<br>或者点下面的按钮选择文件</p>
    <button class="btn" type="button">选择聊天文件</button>
    <input type="file" id="file" accept=".md,.json,.txt,.log" hidden>
    <p class="hint">支持 macOS / Windows / iPhone（Safari）· 兼容纯文本和 JSON 两种格式</p>
  </div>

  <!-- 第二屏：纯享预览 -->
  <div id="viewer" hidden>
    <header>
      <div class="bar">
        <button id="back" type="button">‹ 返回</button>
        <div class="title-wrap">
          <h2 id="title"></h2>
          <div class="meta" id="meta"></div>
        </div>
      </div>
      <div id="chips"></div>
    </header>
    <div id="chat"></div>
  </div>

<script>
(function () {
  "use strict";

  var drop = document.getElementById('drop');
  var fileInput = document.getElementById('file');
  var viewer = document.getElementById('viewer');
  var chat = document.getElementById('chat');
  var titleEl = document.getElementById('title');
  var metaEl = document.getElementById('meta');
  var chipsEl = document.getElementById('chips');
  var backBtn = document.getElementById('back');

  var PALETTE = ['#e05263', '#2f9e6e', '#4a6cf7', '#e8830c', '#9b59b6', '#0f9fc0', '#d94b6e', '#6c8c2f'];
  var GAP_DIVIDER_SEC = 300; // 5 分钟内算同一条连续对话

  // 发件人 → 左右边
  var SENDER_SIDE = { '方景仪': 'right', '沈屿舟': 'left' };

  /* ---------- 解析 ---------- */

  function parseChat(text) {
    text = text.replace(/^﻿/, '').trim();

    // 1) JSON 格式（旧导出）
    if (text[0] === '[' || text[0] === '{') {
      try {
        var data = JSON.parse(text);
        var arr = Array.isArray(data) ? data : (data.messages || data.chat || data.items || []);
        if (Array.isArray(arr) && arr.length) {
          var parsed = arr
            .filter(function (m) { return m && (m.content !== undefined || m.text !== undefined); })
            .map(function (m) {
              return {
                sender: m.sender || m.author || m.from || '未知',
                time: m.time || m.timestamp || '',
                content: m.content || m.text || ''
              };
            });
          if (parsed.length) return { msgs: parsed, format: 'json' };
        }
      } catch (e) { /* 不是 JSON，继续走文本解析 */ }
    }

    // 2) 纯文本格式：[2026-08-13 02:05:23] 方景仪: "内容"
    var re = /^\[([^\]]+)\]\s*([^:]+):\s?(.*)$/;
    var msgs = [];
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(re);
      if (!m) continue;
      var content = m[3].trim();
      if ((content.charAt(0) === '"' && content.charAt(content.length - 1) === '"') ||
          (content.charAt(0) === '“' && content.charAt(content.length - 1) === '”')) {
        content = content.slice(1, -1).trim();
      }
      msgs.push({ sender: m[2].trim(), time: m[1].trim(), content: content });
    }
    if (msgs.length) return { msgs: msgs, format: 'text' };
    return { msgs: [], format: 'none' };
  }

  /* ---------- 渲染 ---------- */

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatContent(text) {
    var t = text.replace(/\r\n/g, '\n');
    t = escapeHtml(t);
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');   // 加粗
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');             // 行内代码
    t = t.replace(/\n/g, '<br>');                               // 换行
    t = t.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return t;
  }

  function toTs(t) {
    var d = new Date(t.replace(' ', 'T'));
    return isNaN(d.getTime()) ? null : d.getTime();
  }
  function gapSec(t1, t2) {
    var a = toTs(t1), b = toTs(t2);
    if (a === null || b === null) return 0;
    return Math.abs(b - a) / 1000;
  }
  function sameDay(t1, t2) {
    var a = toTs(t1), b = toTs(t2);
    if (a === null || b === null) return true;
    var da = new Date(a), db = new Date(b);
    return da.getFullYear() === db.getFullYear() && da.getMonth() === db.getMonth() && da.getDate() === db.getDate();
  }
  function shortTime(t) { var m = t.match(/(\d{2}):(\d{2})$/); return m ? m[1] + ':' + m[2] : t; }

  function render(msgs, fileName, format) {
    // 发件人信息：颜色、左右边（方景仪右、沈屿舟左，其余按出现顺序交替）
    var senderInfo = {};
    var order = [];
    msgs.forEach(function (m) {
      if (!senderInfo[m.sender]) {
        var idx = order.length;
        order.push(m.sender);
        senderInfo[m.sender] = {
          color: PALETTE[idx % PALETTE.length],
          side: SENDER_SIDE[m.sender] || (idx % 2 === 0 ? 'left' : 'right')
        };
      }
    });

    // 分组：同发件人 + 5 分钟内 → 紧凑
    var groups = [];
    for (var i = 0; i < msgs.length; i++) {
      var m = msgs[i], prev = msgs[i - 1];
      var grouped = prev && prev.sender === m.sender &&
                    gapSec(prev.time, m.time) < GAP_DIVIDER_SEC && sameDay(prev.time, m.time);
      groups.push({ msg: m, grouped: grouped });
    }

    var firstT = msgs[0].time, lastT = msgs[msgs.length - 1].time;
    titleEl.textContent = fileName;
    metaEl.textContent = msgs.length + ' 条消息 · ' + (format === 'json' ? 'JSON' : '纯文本') + ' 格式';
    if (firstT && lastT) metaEl.textContent += ' · ' + firstT.slice(0, 10) + ' 至 ' + lastT.slice(0, 10);

    // 发件人筛选 chips
    chipsEl.innerHTML = '';
    var allChip = document.createElement('span');
    allChip.className = 'chip on';
    allChip.textContent = '全部';
    allChip.dataset.sender = '';
    chipsEl.appendChild(allChip);
    order.forEach(function (s) {
      var c = document.createElement('span');
      c.className = 'chip';
      c.textContent = s;
      c.dataset.sender = s;
      chipsEl.appendChild(c);
    });

    // 聊天区
    chat.innerHTML = '';
    var frag = document.createDocumentFragment();
    for (var j = 0; j < groups.length; j++) {
      var g = groups[j], m = g.msg, info = senderInfo[m.sender];

      if (j > 0) {
        var prevG = groups[j - 1];
        var prevMsg = prevG.msg;
        var needDiv = !sameDay(prevMsg.time, m.time) || gapSec(prevMsg.time, m.time) >= GAP_DIVIDER_SEC;
        if (needDiv) {
          var dv = document.createElement('div');
          dv.className = 'divider';
          var sp = document.createElement('span');
          sp.textContent = m.time;
          dv.appendChild(sp);
          frag.appendChild(dv);
        }
      }

      var row = document.createElement('div');
      row.className = 'msg ' + info.side + (g.grouped ? ' grouped' : '');

      // 名字 + 气泡 + 时间
      var wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';
      var nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = m.sender;
      var bb = document.createElement('div');
      bb.className = 'bubble';
      bb.innerHTML = formatContent(m.content);
      var tm = document.createElement('div');
      tm.className = 'time';
      tm.textContent = m.time ? shortTime(m.time) : '';
      wrap.appendChild(nm);
      wrap.appendChild(bb);
      wrap.appendChild(tm);

      row.appendChild(wrap);

      frag.appendChild(row);
    }
    chat.appendChild(frag);
    chat.scrollTop = 0;
  }

  /* ---------- 界面切换 & 文件读取 ---------- */

  function showScreen(which) {
    drop.hidden = (which === 'viewer');
    viewer.hidden = (which !== 'viewer');
  }

  function loadFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      var result = parseChat(e.target.result);
      if (!result.msgs.length) {
        chat.innerHTML = '<div id="error">没有在这份文件里找到聊天消息。<br>'
          + '它应该是类似这样的行：<pre>[2026-08-13 02:05:23] 方景仪: "你好"</pre>'
          + '如果你拖的是日记/笔记文件，那确实不是聊天记录。</div>';
        return;
      }
      showScreen('viewer');
      render(result.msgs, file.name, result.format);
    };
    reader.onerror = function () {
      chat.innerHTML = '<div id="error">读取文件失败，请重试。</div>';
      showScreen('viewer');
    };
    reader.readAsText(file, 'utf-8');
  }

  // 返回上一屏
  backBtn.addEventListener('click', function () { showScreen('drop'); });

  // 筛选
  chipsEl.addEventListener('click', function (ev) {
    var chip = ev.target.closest('.chip');
    if (!chip) return;
    Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function (c) { c.classList.remove('on'); });
    chip.classList.add('on');
    var want = chip.dataset.sender;
    Array.prototype.forEach.call(chat.querySelectorAll('.msg'), function (r) {
      r.style.display = (!want || r.querySelector('.name').textContent === want) ? '' : 'none';
    });
  });

  // 选择/拖放
  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { loadFile(fileInput.files[0]); fileInput.value = ''; });

  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('drag'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });

  // 防止浏览器直接把文件打开（而不是加载进页面）
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });

})();
</script>
</body>
</html>
